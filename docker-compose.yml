services:
  db:
    image: postgres:13-alpine
    container_name: admin_panel_db
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: admin_panel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default

  admin-panel:
    build: .
    container_name: admin_panel
    ports:
      - "5000:5000"
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./templates:/app/templates
      - ./static:/app/static
    group_add:
      - "4"                      
    extra_hosts:
      - "10.13.16.209:host-gateway"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin_user
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=admin_panel
      - SECRET_KEY=my-very-secure-and-stable-key
      - LOG_FILE_PATH=/var/log/auth.log
      - KEYCLOAK_URL=http://10.13.16.209:8085
      - KEYCLOAK_REALM=stribog-auth-dev
      - KEYCLOAK_ADMIN_CLIENT_ID=admin-panel-backend
      - KEYCLOAK_ADMIN_CLIENT_SECRET=MZ9AeWjXf8ElpsDJIYMQh8HTTpj5TYVK
      - KEYCLOAK_ADMIN_ROLE=admin-panel-admin
      - KEYCLOAK_DEFAULT_ROLE=viewer
      - GIS_API_URL=http://gis_api:8001
      - JWK_URL=http://stribog_auth-keycloak-1:8080/realms/stribog-auth-dev/protocol/openid-connect/certs
      - BROKER_SECRET=b0f82fd00071fc226676eed2308070e67bdd55f29d91f97bf9a43745ed34bfe6
      - TOKEN_BROKER_URL=http://stribog_auth-auth-service-internal-1:8007/internal/token
      - CORS_ORIGIN_REGEX=https://woolf\.local(:\d+)?
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
      - stribog3

volumes:
  postgres_data:

networks:
  stribog3:
    external: true
