{% extends 'base.html' %}
{% block content %}
<h2>Продукты</h2>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<table class="table table-striped">
    <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td><a href="/gis/products/delete/{{ item.id }}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Удалить?')"</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
