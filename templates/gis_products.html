{% extends 'base.html' %}
{% block content %}
<h2>Продукты</h2>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card mb-4">
    <div class="card-header">Создать продукт</div>
    <div class="card-body">
        <form method="POST" action="/gis/products/" class="row g-3">
            <div class="col-md-3"><input type="text" name="product_id" class="form-control" placeholder="product_id" required></div>
            <div class="col-md-3">
                <select name="set_id" class="form-select" required>
                    <option value="">— product_set —</option>
                    {% for ps in product_sets %}
                    <option value="{{ ps.set_id }}">{{ ps.set_id }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2"><input type="text" name="style_type" class="form-control" value="titiler"></div>
            <div class="col-md-3"><input type="text" name="style_content" class="form-control" placeholder="style content"></div>
            <div class="col-md-1"><button class="btn btn-success w-100">Создать</button></div>
        </form>
    </div>
</div>

<table class="table table-striped align-middle">
    <thead><tr><th>product_id</th><th>set_id / style</th><th>Действия</th></tr></thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td><code>{{ item.product_id }}</code></td>
            <td>
                <form method="POST" action="/gis/products/{{ item.product_id }}" class="row g-1">
                    <input type="hidden" name="_method" value="PUT">
                    <div class="col-md-3">
                        <select name="set_id" class="form-select form-select-sm" required>
                            {% for ps in product_sets %}
                            <option value="{{ ps.set_id }}" {% if ps.set_id == item.set_id %}selected{% endif %}>
                                {{ ps.set_id }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="style_type" value="{{ item.style.style_type if item.style else 'titiler' }}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="style_content" value="{{ item.style.content if item.style else '' }}" class="form-control form-control-sm" placeholder="content">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-sm btn-primary w-100">💾</button>
                    </div>
                </form>
            </td>
            <td>
                <form method="POST" action="/gis/products/{{ item.product_id }}" onsubmit="return confirm('Удалить {{ item.product_id }}?')">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-sm btn-danger">🗑</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
