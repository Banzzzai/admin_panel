{% extends 'base.html' %}
{% block content %}
<h2>Воркспейсы</h2>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card mb-4">
    <div class="card-header">Создать воркспейс</div>
    <div class="card-body">
        <form method="POST" action="/gis/workspaces/" class="row g-3">
            <div class="col-md-4"><input type="text" name="workspace_id" class="form-control" placeholder="workspace_id" required></div>
            <div class="col-md-4"><input type="text" name="name" class="form-control" placeholder="Название" required></div>
            <div class="col-md-3"><input type="text" name="description" class="form-control" placeholder="Описание"></div>
            <div class="col-md-1"><button class="btn btn-success w-100">Создать</button></div>
        </form>
    </div>
</div>

<table class="table table-striped align-middle">
    <thead><tr><th>workspace_id</th><th>Название / Описание</th><th>Действия</th></tr></thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td><code>{{ item.workspace_id }}</code></td>
            <td>
                <form method="POST" action="/gis/workspaces/{{ item.workspace_id }}" class="row g-1">
                    <input type="hidden" name="_method" value="PUT">
                    <div class="col-md-5">
                        <input type="text" name="name" value="{{ item.name }}" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-5">
                        <input type="text" name="description" value="{{ item.description or '' }}" class="form-control form-control-sm" placeholder="Описание">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-sm btn-primary w-100">💾</button>
                    </div>
                </form>
            </td>
            <td>
                <form method="POST" action="/gis/workspaces/{{ item.workspace_id }}" onsubmit="return confirm('Удалить {{ item.workspace_id }}?')">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-sm btn-danger">🗑</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
