[project]
name = "admin-panel"
version = "0.1.0"
description = "Админ-панель с управлением пользователями, логами и активностью"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.30,<0.31",
    "jinja2>=3.1,<3.2",
    "python-multipart>=0.0.9,<0.1",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "fastapi-login>=1.9,<2.0",
    "bcrypt>=4.0,<5.0",
]